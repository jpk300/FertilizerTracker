<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plant Care Tracker</title>
  <style>
    :root {
      --bg: #eef6ed;
      --card: #ffffff;
      --accent: #2f7d4d;
      --accent-soft: #e0f1e6;
      --text: #1f2a22;
      --muted: #607063;
    --warn: #d04848;
    --warn-soft: #fdecec;
    --warn-border: #f8caca;
    --border: #d9e8da;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      margin: 0;
      background: radial-gradient(circle at top, #f6fbf4, var(--bg));
      color: var(--text);
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      margin-bottom: 1rem;
    }
    .brand { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .nav { display: flex; flex-wrap: wrap; gap: .4rem .6rem; }
    .nav a {
      text-decoration: none; color: var(--text); padding: .45rem .75rem; border-radius: 999px; display: inline-block;
    }
    .nav a.active, .nav a:hover { background: var(--accent-soft); color: #1d5a36; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem;
      margin-bottom: 1rem; box-shadow: 0 10px 25px rgba(33, 83, 52, 0.06);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    input, textarea, select, button {
      width: 100%; padding: .6rem .7rem; margin-top: .35rem; margin-bottom: .8rem;
      border-radius: 8px; border: 1px solid #cad9cb; font: inherit;
    }
    label { font-weight: 600; }
    .field-help { color: #516356; font-size: .84rem; margin: -.45rem 0 .65rem; }
    button { background: rgba(47, 125, 77, 0.86); color: white; border: 1px solid rgba(255,255,255,.35); font-weight: 600; cursor: pointer; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); box-shadow: 0 8px 20px rgba(18, 63, 39, .18); transition: transform .14s ease, filter .14s ease, box-shadow .14s ease; }
    button:hover { filter: brightness(1.04); transform: translateY(-1px); box-shadow: 0 10px 22px rgba(18, 63, 39, .22); }
    .button-row { display: flex; gap: .65rem; flex-wrap: wrap; margin-top: .7rem; }
    .button-row form { margin: 0; flex: 1 1 240px; }
    .button-row.button-row-actions form { flex: 0 1 auto; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      border-radius: 999px; font-weight: 700; letter-spacing: .01em;
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
      padding: .7rem 1rem;
      min-height: 42px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(36, 78, 52, 0.18); }
    .btn-archive { background: linear-gradient(180deg, #3a8b58, #2f7d4d); }
    .btn-delete { background: linear-gradient(180deg, var(--warn), #b63838); }
    .btn-secondary {
      background: #f5f9f5;
      color: #275339;
      border: 1px solid #bdd4c0;
      box-shadow: 0 5px 12px rgba(37, 76, 51, .10);
    }
    .btn-secondary:hover { background: #edf5ed; }
    @media (min-width: 821px){
      .button-row.button-row-actions { gap: .45rem; margin-top: .55rem; }
      .button-row.button-row-actions .btn {
        width: auto;
        padding: .42rem .72rem;
        min-height: 34px;
        font-size: .82rem;
        border-radius: 10px;
        letter-spacing: 0;
        font-weight: 600;
      }
    }
    .plant-photo {
      width: 86px; height: 86px; border-radius: 14px; object-fit: cover;
      border: 1px solid var(--border); margin: .4rem 0 .3rem;
      box-shadow: 0 8px 16px rgba(24, 47, 33, .11);
    }
    .task { border-left: 4px solid #68ab7f; padding-left: .7rem; margin: .6rem 0; }
    .task.overdue { border-left-color: var(--warn); }
    .task-notes {
      margin: .45rem 0 .7rem;
      color: var(--text);
      white-space: pre-wrap;
    }
    .task-collapsible summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .35rem .75rem;
      align-items: center;
    }
    .task-collapsible summary::-webkit-details-marker { display: none; }
    .task-collapsible summary .summary-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: .35rem; }
    .task-collapsible summary .summary-toggle {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1px solid #bdd4c0;
      border-radius: 999px;
      padding: .22rem .6rem;
      color: #275339;
      background: #f4faf5;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .task-collapsible summary .summary-toggle::before { content: "▾"; color: var(--accent); font-size: .95rem; }
    .task-collapsible summary .summary-toggle::after { content: "Collapse details"; }
    .task-collapsible:not([open]) summary .summary-toggle::before { content: "▸"; }
    .task-collapsible:not([open]) summary .summary-toggle::after { content: "Expand details"; }
    .task-collapsible summary .small { grid-column: 1 / -1; }
    .task-collapsible .task-content { margin-top: .55rem; }
    .button-row a { text-decoration: none; padding: .5rem .8rem; border-radius: 999px; background: rgba(47, 125, 77, 0.12); color: #1d5a36; border: 1px solid rgba(47,125,77,.25); font-weight: 600; }
    .button-row a:hover { background: rgba(47, 125, 77, 0.2); }
    .small { color: var(--muted); font-size: .92rem; }
    .flash { background: var(--accent-soft); color: #1f5f3a; }
    .muted { color: var(--muted); }
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 3px solid #205c38;
      outline-offset: 2px;
      border-radius: 8px;
    }
    @media (max-width: 820px){ .grid { grid-template-columns: 1fr; } .topbar { flex-direction: column; align-items: flex-start; } .nav { width: 100%; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">🌿 Plant Wellbeing Tracker</div>
      <nav class="nav">
        <a class="{{ 'active' if active_page == 'upcoming' else '' }}" href="{{ url_for('upcoming_page') }}">Upcoming & History</a>
        <a class="{{ 'active' if active_page == 'add' else '' }}" href="{{ url_for('add_page') }}">Add Plants & Activities</a>
        <a class="{{ 'active' if active_page == 'settings' else '' }}" href="{{ url_for('settings_page') }}">Settings</a>
      </nav>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="card flash">{{ messages[-1] }}</div>{% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
  <script>
    document.querySelectorAll('form[method="post"]').forEach((form) => {
      if (!form.querySelector('input[name="_csrf_token"]')) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = '_csrf_token';
        input.value = '{{ csrf_token }}';
        form.appendChild(input);
      }
    });
  </script>
</body>
</html>
